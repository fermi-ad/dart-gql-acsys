targets:
    $default:
        builders:
            ferry_generator|graphql_builder:
                enabled: true
                options:
                    schemas:
                        - dart_gql_acsys|lib/src/schema/DPM.graphql
                    type_overrides:
                        Timestamp:
                            name: DateTime
            ferry_generator|serializer_builder:
                enabled: true
                options:
                    schemas:
                        - dart_gql_acsys|lib/src/schema/DPM.graphql
                    custom_serializers:
                        - import: "package:dart_gql_acsys/src/schema/date_serializer.dart"
                          name: DateSerializer